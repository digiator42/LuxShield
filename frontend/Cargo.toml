[package]
name = "luxshield-frontend"
version = "0.1.0"
edition = "2021"

# Standalone crate (like xdp-probe): excluded from the workspace so the
# backend workspace never tries to resolve wasm deps on host builds.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Relative so the dep resolves both on this machine and inside the Docker
# build (/src/LuxShield/frontend -> /src/Velo), which mirrors this layout.
veloasm = { path = "../../Velo/crates/velo", features = ["json"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window","Document","Element","HtmlElement","HtmlCanvasElement",
    "CanvasRenderingContext2d","Node","Text","console",
    "Headers","Request","RequestInit","Response",
    "EventSource","MessageEvent",
    "Worker","WorkerOptions","WorkerType",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = "0.1.7"
gloo-timers = { version = "0.4.0", features = ["futures"] }

