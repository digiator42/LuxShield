[package]
name = "luxshield-backend"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "LuxShield XDP/eBPF network firewall manager built on GritShield"

[features]
default = ["mcp", "sim"]
mcp = ["gritshield/mcp"]
# Simulated ring-buffer source for development on non-Linux hosts / CI.
sim = []
# Live aya-backed XDP ring-buffer reader (Linux + privileged loader only).
ebpf = ["dep:aya"]

[dependencies]
gritshield = { version = "0.3.1", default-features = false }
lux-common = { path = "../lux-common" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
async-trait = "0.1"
aya = { version = "0.13", optional = true }